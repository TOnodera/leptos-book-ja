[book]
title = "Leptos Book 日本語版"
description = "Leptos Webフレームワーク公式Bookの非公式日本語訳"
authors = ["Leptos Contributors", "Japanese Translation Contributors"]
language = "ja"
multilingual = false
src = "src"

[output.html]
additional-css = [
    "./mdbook-admonish.css",
    "./mdbook-admonish-custom.css",
    "./sandbox.css",
]
additional-js = ["./sandbox.js"]
site-url = "/leptos-book-ja/"
git-repository-url = "https://github.com/TOnodera/leptos-book-ja"
edit-url-template = "https://github.com/TOnodera/leptos-book-ja/edit/main/{path}"
[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.1"    # do not edit: managed by `mdbook-admonish install`

[[preprocessor.admonish.custom]]
directive = "sandbox"
color = "#DCFF50"
icon = "./CodeSandbox-Square-Logo.svg"
